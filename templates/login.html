{% extends 'base.html' %}
{% block content %}
<h3>Login</h3>
<form method="post">
    <input type="email" name="email" placeholder="Email" required><br>
    <input type="password" name="password" placeholder="Password" required><br>
    <input type="submit" value="Login">
</form>
<p>No account? <a href="{{ url_for('signup') }}">Sign up</a></p>
{% endblock %}
